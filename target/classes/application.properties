spring.application.name=routewise-core

server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------
# OSRM (self-hosted). The base URL of a local OSRM HTTP instance,
# e.g. started with:  osrm-routed osrm-data/city.osrm --port 5000
# ------------------------------------------------------------------
osrm.base-url=${OSRM_BASE_URL:http://localhost:5000}

# ------------------------------------------------------------------
# Optimization solver settings (OR-Tools TSP).
# Seconds OR-Tools may spend improving the initial solution. 0 = pure
# greedy first-solution strategy (fast, deterministic). Higher values
# improve solution quality at the cost of latency.
# ------------------------------------------------------------------
solver.time-limit-seconds=${SOLVER_TIME_LIMIT_SECONDS:10}

# ------------------------------------------------------------------
# Geocoding provider (OSM Nominatim by default).
# country-codes = ISO-3166-1 alpha-2 list, comma-separated, empty
#   for unrestricted (e.g. "in,au" for Australia+India).
# ------------------------------------------------------------------
geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
geocoding.user-agent=${GEOCODING_USER_AGENT:RouteWise/0.1}
geocoding.country-codes=${GEOCODING_COUNTRY_CODES:}

# ------------------------------------------------------------------
# Routing eligibility.
# false (default) = AUTO_GEOCODED deliveries can be routed (flagged
#   in the API so the frontend can warn the driver).
# true  = driver MUST confirm each pin first via PATCH coordinates.
# ------------------------------------------------------------------
routing.require-confirmed-geocode=${REQUIRE_CONFIRMED_GEOCODE:false}

# ------------------------------------------------------------------
# PostgreSQL (PostGIS extension optional; entities use plain
# longitude/latitude plus a jsonb column for the delivery order).
# ------------------------------------------------------------------
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/routewise}
spring.datasource.username=${POSTGRES_USER:routewise}
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Serialize java.time as ISO-8601 strings instead of epoch timestamps.
spring.jackson.serialization.write-dates-as-timestamps=false